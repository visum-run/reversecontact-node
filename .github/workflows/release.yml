name: Release TypeScript SDK

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { appendFileSync, readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match package.json version')
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nprerelease=${/^\d+\.\d+\.\d+-/.test(version)}\n`)
          NODE
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: bun run build
      - name: Check package exports
        run: bun run check:package
      - name: Compile ESM and CommonJS consumers without the DOM lib
        run: bun run check:consumer
      - name: Smoke test ESM and CommonJS
        run: node scripts/smoke-dist.mjs
      - name: Package, smoke test the tarball, and extract release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          node scripts/release-notes.mjs "$RELEASE_VERSION" > artifacts/release-notes.md
          npm pack --pack-destination artifacts
          node scripts/smoke-tarball.mjs artifacts/*.tgz
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: |
            artifacts/*.tgz
            artifacts/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: artifacts
      - name: Setup Node 24 and npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Require npm 11.5.1 or later for trusted publishing
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim()
          const [major, minor, patch] = version.split('.').map(Number)
          assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), `npm >=11.5.1 required, found ${version}`)
          NODE
      - name: Publish the tested tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(--access public --provenance)
          if [[ "$PRERELEASE" == 'true' ]]; then args+=(--tag next); fi
          npm publish ./artifacts/*.tgz "${args[@]}"

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download tested artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: artifacts
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.tgz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file artifacts/release-notes.md)
          if [[ "$PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.tgz "${args[@]}"
